name: build

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y ros-jazzy-ros2-control ros-jazzy-ros2-controllers
          rosdep update
          rosdep install --from-paths libtaurob taurob_tracker_description taurob_watchdog taurob_watchdog_client taurob_tracker_hardware --ignore-src -y --rosdistro jazzy

      # Build only the packages already ported to ROS 2/ament; the remaining
      # watchdog packages are still catkin and are ported in Phase 2.
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select libtaurob taurob_tracker_description taurob_watchdog taurob_watchdog_client taurob_tracker_hardware --event-handlers console_direct+

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select libtaurob taurob_tracker_description taurob_watchdog taurob_watchdog_client taurob_tracker_hardware --event-handlers console_direct+
          colcon test-result --verbose

  urdf_check:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xacro and check URDF
        run: |
          . /opt/ros/jazzy/setup.bash
          apt-get update -qq
          apt-get install -y ros-jazzy-xacro git
          git clone --depth 1 https://github.com/tu-darmstadt-ros-pkg/hector_models.git /tmp/hector_models
          colcon build --packages-select taurob_tracker_description
          . install/setup.bash
          # hector_xacro_tools is a ROS 1 (catkin) package containing only
          # xacro macros; stage it on the ament prefix path instead of building it.
          mkdir -p install/hector/share/ament_index/resource_index/packages
          touch install/hector/share/ament_index/resource_index/packages/hector_xacro_tools
          cp -r /tmp/hector_models/hector_xacro_tools install/hector/share/
          export AMENT_PREFIX_PATH=$PWD/install/hector:$AMENT_PREFIX_PATH
          xacro taurob_tracker_description/urdf/tracker.urdf.xacro > /tmp/tracker.urdf
          grep -q "<robot" /tmp/tracker.urdf
          xacro taurob_tracker_description/urdf/tracker_arm.urdf.xacro > /tmp/tracker_arm.urdf
          grep -q "<robot" /tmp/tracker_arm.urdf

  watchdog_test:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -qq
          rosdep update
          rosdep install --from-paths libtaurob taurob_watchdog taurob_watchdog_client --ignore-src -y --rosdistro jazzy

      - name: Build
        run: |
          . /opt/ros/jazzy/setup.bash
          colcon build --packages-select libtaurob taurob_watchdog taurob_watchdog_client --event-handlers console_direct+

      - name: Watchdog feeds while client is running
        run: |
          . install/setup.bash
          ros2 run taurob_watchdog taurob_watchdog_node > /tmp/watchdog_node.log 2>&1 &
          NODE_PID=$!
          # keep the client's stdin open for 10 s so it keeps sending TWF pulses
          sleep 10 | ros2 run taurob_watchdog_client taurob_watchdog_client 127.0.0.1 &
          CLIENT_PID=$!
          sleep 2
          FEED=$(timeout 5 ros2 topic echo --once /watchdog_feed --field data)
          echo "watchdog_feed: $FEED"
          kill $CLIENT_PID $NODE_PID
          pkill -f taurob_watchdog_client || true
          pkill -f taurob_watchdog_node || true
          echo "$FEED" | grep -qw True || { echo "FAIL: expected watchdog_feed True"; cat /tmp/watchdog_node.log; exit 1; }

      - name: Watchdog stops feeding after client exits
        run: |
          . install/setup.bash
          pkill -f taurob_watchdog_node || true
          sleep 1
          ros2 run taurob_watchdog taurob_watchdog_node > /tmp/watchdog_node2.log 2>&1 &
          NODE_PID=$!
          sleep 2
          # the node must own UDP port 19090; a lingering instance would fail the bind
          ! grep -q "Address already in use" /tmp/watchdog_node2.log || { echo "FAIL: watchdog node could not bind"; cat /tmp/watchdog_node2.log; exit 1; }
          # client with immediate EOF on stdin: sends pulses only briefly
          ros2 run taurob_watchdog_client taurob_watchdog_client 127.0.0.1 < /dev/null &
          sleep 1
          # after the pulses stop, no new watchdog_feed message may arrive
          if timeout 3 ros2 topic echo --once /watchdog_feed --field data; then
            echo "FAIL: watchdog still feeding after client stopped"; cat /tmp/watchdog_node2.log; kill $NODE_PID; exit 1
          fi
          kill $NODE_PID
          pkill -f taurob_watchdog_node || true
          echo "PASS: watchdog ceased to feed after client stopped"
