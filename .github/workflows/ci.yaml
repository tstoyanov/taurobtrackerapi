name: build

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -qq
          rosdep update
          rosdep install --from-paths . --ignore-src -y --rosdistro jazzy

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  urdf_check:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xacro and check URDF
        run: |
          apt-get update -qq
          apt-get install -y ros-jazzy-xacro
          git clone --depth 1 https://github.com/tu-darmstadt-ros-pkg/hector_models.git /tmp/hector_models
          xacro taurob_tracker_description/urdf/tracker.urdf.xacro > /tmp/tracker.urdf
          grep -q "<robot" /tmp/tracker.urdf
          xacro taurob_tracker_description/urdf/tracker_arm.urdf.xacro > /tmp/tracker_arm.urdf
          grep -q "<robot" /tmp/tracker_arm.urdf
